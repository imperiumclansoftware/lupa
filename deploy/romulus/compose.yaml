# Romulus, le miroir hors ligne Lupa : sur un serveur du réseau isolé.
# Installation et réglages : README.md (même contenu que la page Docker Hub iemperor/romulus).
name: romulus

services:
  romulus:
    image: ${ROMULUS_IMAGE:-iemperor/romulus:latest}
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8080}:8080"
    environment:
      # Adresse des paquets donnée aux clients ; vide = celle par laquelle ils contactent le miroir
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Facultatif : généré au premier démarrage et conservé dans le volume (ou Docker secret via APP_SECRET_FILE)
      APP_SECRET: ${APP_SECRET:-}
      APP_SECRET_FILE: ${APP_SECRET_FILE:-}
    volumes:
      - data:/data
      # Point de montage des clés USB, en lecture seule. Les bundles sont cherchés jusqu'à deux niveaux
      # de sous-dossiers (/media/<utilisateur>/<CLÉ>/sas-….tar) ; rslave : une clé branchée après le
      # démarrage apparaît sans redémarrer le conteneur.
      - type: bind
        source: ${USB_DIR:-/media}
        target: /inbox
        read_only: true
        bind:
          propagation: rslave
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /config:mode=1777
      # Cache Symfony et journaux, reconstruits au démarrage
      - /app/var:mode=1777

volumes:
  data:
