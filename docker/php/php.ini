; Réglages dev, sans fuite d'informations inutiles
expose_php = Off
memory_limit = 512M
; Envoi de bundles par morceaux de 16 Mo depuis l'interface du miroir
upload_max_filesize = 32M
post_max_size = 34M
date.timezone = Europe/Paris
display_errors = On
error_reporting = E_ALL

session.cookie_httponly = 1
session.cookie_secure = 0 ; HTTP local : cookie "Secure" impossible
session.cookie_samesite = Strict
session.use_strict_mode = 1

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
