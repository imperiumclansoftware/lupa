[global]
error_log = /proc/self/fd/2

[www]
; user/group renseignés au build uniquement si PHP tourne en root (Docker rootless)
user =
group =
listen = 9000
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
