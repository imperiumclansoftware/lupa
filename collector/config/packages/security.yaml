security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    providers:
        users:
            entity:
                class: App\Entity\User
                property: username
    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt)/
            security: false
        main:
            lazy: true
            provider: users
            # Session (cookie SameSite=Strict, HttpOnly) : front et API sur la même origine
            json_login:
                check_path: /api/login
                username_path: username
                password_path: password
                success_handler: App\Security\JsonLoginHandler
                failure_handler: App\Security\JsonLoginHandler
            logout:
                path: /api/logout
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            entry_point: App\Security\JsonLoginHandler
    access_control:
        - { path: ^/api/(login|session|setup)$, roles: PUBLIC_ACCESS }
        - { path: ^/api/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
