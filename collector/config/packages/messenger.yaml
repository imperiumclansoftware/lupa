framework:
    messenger:
        failure_transport: failed
        transports:
            # Tâches longues (téléchargements, exports, imports) exécutées par le conteneur worker
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 0
            failed: 'doctrine://default?queue_name=failed'
        routing:
            'App\Message\AsyncMessage': async

when@test:
    framework:
        messenger:
            transports:
                async: 'sync://'
