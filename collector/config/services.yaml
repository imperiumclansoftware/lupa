parameters:
    # Version de Lupa, fixée à la construction de l'image (make release) ; « dev » en développement
    env(APP_VERSION): 'dev'
    # Nom du cookie de session : préfixe __Host- derrière un proxy HTTPS (entrypoint de production, ADR 0002)
    env(SESSION_NAME): 'sas_collector'
    # Documents PDF (conditions, confidentialité, politiques de sécurité) : dépôt en développement, image en production
    env(DOCUMENTS_DIR): '%kernel.project_dir%/../docs/legal'
    env(TOTP_ISSUER): 'Lupa Rémus'
    env(SETUP_TOKEN_FILE): '%kernel.project_dir%/var/setup.code'
    env(SESSION_DIR): '%kernel.project_dir%/var/sessions/%kernel.environment%'
    env(IDENTITY_DIR): '%kernel.project_dir%/var/identity'
    env(STORAGE_DIR): '%kernel.project_dir%/var/storage'
    env(EXPORT_DIR): '%kernel.project_dir%/var/exports'
    env(GITHUB_TOKEN): ''
    env(DOCKERHUB_USERNAME): ''
    env(DOCKERHUB_TOKEN): ''
    env(NPM_REGISTRY): 'https://registry.npmjs.org'
    env(PYPI_INDEX): 'https://pypi.org'
    env(PIP_BIN): '/opt/pip/bin/pip'
    env(SYSTEM_CACHE_DIR): '%kernel.project_dir%/var/system'
    env(GPGV_BIN): 'gpgv'
    env(GALAXY_URL): 'https://galaxy.ansible.com'
    env(OPENVSX_URL): 'https://open-vsx.org'
    env(VSCODE_MARKETPLACE_URL): 'https://marketplace.visualstudio.com'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $storageDir: '%env(STORAGE_DIR)%'
            string $exportDir: '%env(EXPORT_DIR)%'
            string $identityDir: '%env(IDENTITY_DIR)%'

    App\:
        resource: '../src/'

    # Stockage des paquets : disque ou bucket S3 (Réglages › Stockage)
    Sas\Bundle\BlobStore:
        factory: ['@App\Storage\BlobStoreFactory', 'create']
        arguments: ['%env(STORAGE_DIR)%']
    Sas\Bundle\StorageSettings:
        arguments: { $tempDir: '%env(STORAGE_DIR)%/tmp' }
    Sas\Bundle\SecretSealer: '@App\Source\SecretBox'
    Sas\Bundle\BlobMigration: ~
